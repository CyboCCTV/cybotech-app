<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cybotech Security - Cheruvannur</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Manrope,sans-serif}
body{margin:0;background:#f5f7fb}
.header{background:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:9}
.logo{height:56px}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.btn{border:0;border-radius:12px;padding:13px;font-weight:800;width:100%;cursor:pointer}
.btn-red{background:#b91c1c;color:#fff}
.btn-blue{background:#0f2a5e;color:#fff}
.btn-gold{background:#ffb703;color:#111}
.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0 10px}
.tab{padding:7px 12px;border-radius:20px;background:#e5e7eb;font-size:12px;font-weight:700;cursor:pointer;display:inline-block;margin:3px}
.tab.active{background:#0f2a5e;color:#fff}
.status{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:800}
.s-new{background:#fee2e2;color:#991b1b}
.s-completed{background:#dcfce7;color:#166534}
.s-pending{background:#fef3c7;color:#92400e}
.small{font-size:12px;color:#666}
</style>
</head>

<script>
var STORE='cybotech_req_v6';
var PHONE='cybotech_phone_v6';
function getReq(){return JSON.parse(localStorage.getItem(STORE)||'[]')}
function saveReq(r){localStorage.setItem(STORE,JSON.stringify(r))}
function getPhone(){return localStorage.getItem(PHONE)||''}
function setPhone(p){localStorage.setItem(PHONE,p)}
function isStaff(){
  var s=new URLSearchParams(location.search).get('staff');
  var h=location.hash.toLowerCase();
  return s!==null || h.indexOf('staff')>-1 || h==='#1' || h==='#0';
}
var currentPhone=getPhone();
var view='home';
function render(){
  var app=document.getElementById('app');
  if(isStaff()){renderStaff(app);return;}
  if(!currentPhone){
    app.innerHTML='<div class="card"><h3>Enter Phone</h3><p class="small">See only your complaints</p><input id="ph" class="input" placeholder="9876543210"><button class="btn btn-blue" onclick="savePhone()">Continue</button></div><div id="cards"></div>';
    renderCards(document.getElementById('cards'));return;
  }
  var my=getReq().filter(function(r){return r.phone===currentPhone});
  var need=my.find(function(r){return r.status==='Completed' && !r.rating});
  if(need && view!=='form'){renderRating(app,need);return;}
  var list=my.length?my.map(function(r){return '<div style="border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0"><b>'+r.id+'</b> '+r.type+'<br><span class="status s-'+r.status.toLowerCase()+'">'+r.status+'</span> '+r.date+'<br>'+r.issue+'<br>'+r.location+'</div>'}).join(''):'<p class="small">No requests yet - create below</p>';
  app.innerHTML='<div class="card"><h3>Your Requests</h3><p class="small">Phone: '+currentPhone+' <a href="#" onclick="changePh()">Change</a></p>'+list+'<button class="btn btn-blue" onclick="view=\'form\';render()">+ New Request</button></div><div id="cards" style="'+(view==='form'?'':'display:none')+'"></div>';
  if(view==='form') renderCards(document.getElementById('cards'));
}
function savePhone(){
  var v=document.getElementById('ph').value.replace(/\D/g,'').slice(-10);
  if(v.length<10){alert('10 digit');return;}
  setPhone(v);currentPhone=v;view='home';render();
}
function changePh(){localStorage.removeItem(PHONE);currentPhone='';render();}
function renderCards(c){
  if(!c) return;
  c.innerHTML='<div class="card" style="border-left:5px solid #b91c1c"><h3 style="color:#b91c1c">🔧 CCTV Repair</h3><input id="r_name" class="input" placeholder="Name"><input id="r_phone" class="input" placeholder="Phone" value="'+currentPhone+'"><input id="r_loc" class="input" placeholder="Location"><select id="r_issue" class="input"><option>DVR Not Recording</option><option>Camera No Display</option><option>HDD Issue</option><option>Other</option></select><button class="btn btn-red" onclick="submitF(\'Repair\')">Submit Repair - WhatsApp</button></div><div class="card" style="border-left:5px solid #0f2a5e"><h3 style="color:#0f2a5e">📹 New Installation</h3><div style="background:#fff7cc;padding:6px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:8px">💳 Bajaj Finserv EMI - Down Payment-il</div><input id="i_name" class="input" placeholder="Name"><input id="i_phone" class="input" placeholder="Phone" value="'+currentPhone+'"><input id="i_loc" class="input" placeholder="Location"><input id="i_cam" class="input" placeholder="Cameras e.g. 4"><select id="i_emi" class="input"><option>No EMI</option><option>Yes EMI</option></select><button class="btn btn-blue" onclick="submitF(\'Installation\')">Submit Installation</button></div>';
}
function submitF(type){
  var isR=type==='Repair';
  var name=document.getElementById(isR?'r_name':'i_name').value.trim();
  var phone=document.getElementById(isR?'r_phone':'i_phone').value.replace(/\D/g,'').slice(-10);
  var loc=document.getElementById(isR?'r_loc':'i_loc').value.trim();
  var issue=isR?document.getElementById('r_issue').value:'Cameras: '+document.getElementById('i_cam').value+' EMI:'+document.getElementById('i_emi').value;
  if(!name||!phone||!loc){alert('Fill all');return;}
  var id='CYB-'+Math.floor(1000+Math.random()*9000);
  var req={id:id,type:type,name:name,phone:phone,location:loc,issue:issue,status:'New',date:new Date().toLocaleDateString(),rating:null};
  var all=getReq();all.unshift(req);saveReq(all);setPhone(phone);currentPhone=phone;
  var msg=encodeURIComponent((type==='Repair'?'🔧 REPAIR':'📹 INSTALLATION')+'\nID:'+id+'\nName:'+name+'\nPhone:'+phone+'\nLoc:'+loc+'\n'+issue);
  window.open('https://wa.me/917592996699?text='+msg,'_blank');
  view='home';render();alert('Sent ID '+id);
}
function renderStaff(app){
  var all=getReq();
  var f=window.staffFilter||'New';
  var filtered=f==='All'?all:all.filter(function(r){if(f==='New') return r.status==='New'; if(f==='Pending') return r.status!=='Completed'; if(f==='Installation') return r.type==='Installation'; if(f==='Completed') return r.status==='Completed'; return true});
  var html='<div class="card"><h3>Operator 7592996699 - No Password</h3><div><span class="tab '+(f==='New'?'active':'')+'" onclick="window.staffFilter=\'New\';render()">New</span><span class="tab '+(f==='Pending'?'active':'')+'" onclick="window.staffFilter=\'Pending\';render()">Pending</span><span class="tab '+(f==='Installation'?'active':'')+'" onclick="window.staffFilter=\'Installation\';render()">Install</span><span class="tab '+(f==='Completed'?'active':'')+'" onclick="window.staffFilter=\'Completed\';render()">Completed</span><span class="tab '+(f==='All'?'active':'')+'" onclick="window.staffFilter=\'All\';render()">All</span></div><p class="small">Total '+filtered.length+'</p>';
  html+=filtered.map(function(r){return '<div style="border:1px solid #eee;border-radius:10px;padding:10px;margin:8px 0"><b>'+r.id+'</b> '+r.type+' <span class="status s-'+r.status.toLowerCase()+'">'+r.status+'</span><br>'+r.name+' '+r.phone+'<br>'+r.location+'<br>'+r.issue+'<br><button onclick="upd(\''+r.id+'\',\'Completed\')" style="margin-top:6px;padding:6px 10px;border:0;background:#dcfce7;border-radius:8px;font-weight:700">Mark Completed</button> <a href="tel:'+r.phone+'" style="padding:6px 10px;background:#111;color:#fff;border-radius:8px;text-decoration:none;font-size:12px">Call</a></div>'}).join('')+'<br><button class="btn" style="background:#eee" onclick="location.href=location.pathname">Exit Staff</button></div>';
  app.innerHTML=html;
}
function upd(id,st){
  var all=getReq();var r=all.find(function(x){return x.id===id});r.status=st;saveReq(all);
  if(st==='Completed'){var m=encodeURIComponent('Hi '+r.name+' Your work '+id+' completed! Please rate: '+location.href); window.open('https://wa.me/91'+r.phone+'?text='+m,'_blank');}
  render();
}
function renderRating(app,req){
  app.innerHTML='<div class="card" style="text-align:center"><h2>Work Completed! 🎉</h2><p>'+req.id+'</p><div id="stars" style="font-size:36px"><span onclick="setR(1)">☆</span><span onclick="setR(2)">☆</span><span onclick="setR(3)">☆</span><span onclick="setR(4)">☆</span><span onclick="setR(5)">☆</span></div><p id="rl" class="small">Bad / Average / Good / Very Good / Excellent</p><textarea id="cmt" class="input" placeholder="Comment"></textarea><button class="btn btn-gold" onclick="subR(\''+req.id+'\')">Submit 1-5 Rating</button></div>';
  window._r=0;
}
function setR(n){window._r=n;var labels=['','Bad','Average','Good','Very Good','Excellent'];document.getElementById('rl').innerText=labels[n]+' '+n+'/5';document.getElementById('stars').innerHTML=[1,2,3,4,5].map(function(i){return '<span onclick="setR('+i+')" style="cursor:pointer">'+(i<=n?'★':'☆')+'</span>'}).join('');}
function subR(id){var all=getReq();var r=all.find(function(x){return x.id===id});r.rating=window._r||5;r.comment=document.getElementById('cmt').value;saveReq(all);alert('Thanks!');view='home';render();}
document.getElementById('staffLink').onclick=function(e){e.preventDefault();history.pushState(null,'','?staff=1');render();};
render();
</script>
